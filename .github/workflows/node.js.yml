# Builds the site and deploys it to GitHub Pages.
#
# Build and deploy are separate jobs, so the Pages artifact is fully uploaded (its job has
# finished) before deploy-pages looks for it. If a deploy fails, use "Re-run failed jobs":
# that re-runs only the deploy job against the existing artifact. Re-running the build job
# too would upload a second "github-pages" artifact into the run, and deploy-pages refuses
# to choose between them.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Checkout
        uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: SPA fallback for client-side routes
        run: cp ./dist/index.html ./dist/404.html
      - name: Create .nojekyll file
        run: touch ./dist/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
